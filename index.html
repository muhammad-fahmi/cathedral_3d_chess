        } else if (preset === 'OBSIDIAN') {
          this.camSpherical.targetTheta = Math.PI;
          this.camSpherical.targetPhi = 0.98;
          this.camSpherical.targetRadius = 11.4;
        } else if (preset === 'TOP') {
          this.camSpherical.targetTheta = 0;
          this.camSpherical.targetPhi = 0.16;
          this.camSpherical.targetRadius = 13.5;
        }
      }

      updateCameraPillsUI() {
        document.querySelectorAll('.cam-btn').forEach((btn) => {
          btn.classList.toggle('active', btn.dataset.cam === this.cameraPreset);
        });
      }

      toggleAudio() {
        this.audio.enabled = !this.audio.enabled;
        const icon = document.getElementById('audio-icon');
        icon.textContent = this.audio.enabled ? 'volume_up' : 'volume_off';
        if (this.audio.enabled) this.audio.playSelect();
      }

      undoMove() {
        if (this.isAnimating) return;
        this.chess.undo();
        if (this.gameMode === 'VS_AI' && this.chess.turn() === 'b') {
          this.chess.undo();
        }
        this.selectedSquare = null;
        this.legalMoves = [];
        this.lastMove = null;
        this.pendingPromotion = null;
        document.getElementById('promotion-bar').classList.add('hidden');
        document.getElementById('status-banner').classList.add('hidden');
        this.syncBoardWithChessEngine();
        this.updateHUD();
        this.audio.playSelect();
      }

      resetGame() {
        if (this.isAnimating) return;
        this.chess.reset();
        this.selectedSquare = null;
        this.legalMoves = [];
        this.lastMove = null;
        this.pendingPromotion = null;
        document.getElementById('promotion-bar').classList.add('hidden');
        document.getElementById('status-banner').classList.add('hidden');
        this.syncBoardWithChessEngine();
        this.updateHUD();
        this.audio.playSelect();
      }

      updateHUD() {
        const turn = this.chess.turn(); // 'w' or 'b'
        const turnDot = document.getElementById('turn-dot');
        const turnText = document.getElementById('turn-text');
        const statusBanner = document.getElementById('status-banner');
        const bannerTitle = document.getElementById('banner-title');
        const bannerSub = document.getElementById('banner-sub');

        if (turn === 'w') {
          turnDot.className = 'w-3 h-3 rounded-full bg-[#F5F2EB] shadow-[0_0_8px_#fff] transition-all duration-300';
          turnText.textContent = this.chess.in_check() ? "Marble's Turn (CHECK!)" : "Marble's Turn";
        } else {
          turnDot.className = 'w-3 h-3 rounded-full bg-[#9C27B0] border border-[#D0BCFF] shadow-[0_0_8px_#D0BCFF] transition-all duration-300';
          turnText.textContent = this.chess.in_check() ? "Obsidian's Turn (CHECK!)" : "Obsidian's Turn";
        }

        // Check for Game Over states
        if (this.chess.game_over()) {
          statusBanner.classList.remove('hidden');
          if (this.chess.in_checkmate()) {
            const winner = turn === 'w' ? 'Obsidian' : 'Marble';
            bannerTitle.textContent = `CHECKMATE • ${winner.toUpperCase()} TRIUMPHS`;
            bannerSub.textContent = `${winner} shatters the opposing monarch's defenses.`;
          } else {
            bannerTitle.textContent = ' CATHEDRAL DRAW';
            bannerSub.textContent = 'Stalemate or repetition reached on the sacred altar.';
          }
        } else {
          statusBanner.classList.add('hidden');
        }

        // Compute Captured Pieces & Material Advantage from current board state
        const startCounts = { p: 8, n: 2, b: 2, r: 2, q: 1 };
        const currentW = { p: 0, n: 0, b: 0, r: 0, q: 0 };
        const currentB = { p: 0, n: 0, b: 0, r: 0, q: 0 };
        const board = this.chess.board();

        for (let r = 0; r < 8; r++) {
          for (let f = 0; f < 8; f++) {
            const cell = board[r][f];
            if (cell && cell.type !== 'k') {
              if (cell.color === 'w') currentW[cell.type] = (currentW[cell.type] || 0) + 1;
              else currentB[cell.type] = (currentB[cell.type] || 0) + 1;
            }
          }
        }

        const icons = { q: '♛', r: '♜', b: '♝', n: '♞', p: '♟' };
        const vals = { q: 9, r: 5, b: 3, n: 3, p: 1 };

        let shatteredObsidianHTML = '';
        let shatteredMarbleHTML = '';
        let wMat = 0;
        let bMat = 0;

        ['q', 'r', 'b', 'n', 'p'].forEach((t) => {
          wMat += (currentW[t] || 0) * vals[t];
          bMat += (currentB[t] || 0) * vals[t];

          const capB = Math.max(0, startCounts[t] - (currentB[t] || 0));
          for (let i = 0; i < capB; i++) {
            shatteredObsidianHTML += `<span class="inline-block leading-none">${icons[t]}</span>`;
          }

          const capW = Math.max(0, startCounts[t] - (currentW[t] || 0));
          for (let i = 0; i < capW; i++) {
            shatteredMarbleHTML += `<span class="inline-block leading-none">${icons[t]}</span>`;
          }
        });

        document.getElementById('captured-by-marble').innerHTML =
          shatteredObsidianHTML || '<span class="text-[11px] text-white/30 italic">No shards yet</span>';
        document.getElementById('captured-by-obsidian').innerHTML =
          shatteredMarbleHTML || '<span class="text-[11px] text-white/30 italic">No shards yet</span>';

        const diff = wMat - bMat;
        document.getElementById('marble-adv').textContent = diff > 0 ? `+${diff}` : '';
        document.getElementById('obsidian-adv').textContent = diff < 0 ? `+${Math.abs(diff)}` : '';

        // Update Single-Line Algebraic Move Ticker
        const history = this.chess.history({ verbose: true });
        const tickerEl = document.getElementById('move-ticker');
        if (history.length === 0) {
          tickerEl.innerHTML =
            '<span class="text-white/40 font-sans text-[11px]">Click any piece to view legal moves • Use "Strike Demo" to witness combat</span>';
        } else {
          const recent = history.slice(-8);
          tickerEl.innerHTML = recent
            .map((m, idx) => {
              const moveNum = history.length - recent.length + idx + 1;
              const isCap = m.flags.includes('c') || m.flags.includes('e');
              return `<span class="px-2 py-0.5 rounded-md ${
                isCap
                  ? 'bg-[#8C1D18]/60 text-[#F2B8B5] border border-[#F2B8B5]/30'
                  : 'bg-white/5 text-[#E6E0E9]'
              }">${moveNum}. ${m.san}${isCap ? ' 💥' : ''}</span>`;
            })
            .join('');
        }
      }

      /* =====================================================================
         MAIN RENDER & PHYSICS ANIMATION LOOP (60 FPS)
      ====================================================================== */
      animate() {
        requestAnimationFrame(this.animate);

        const dt = Math.min(this.clock.getDelta(), 0.1);
        const elapsed = this.clock.getElapsedTime();

        // 1. Smoothly Interpolate Camera Spherical Position & Combat Micro-Shake
        this.camSpherical.theta += (this.camSpherical.targetTheta - this.camSpherical.theta) * 0.09;
        this.camSpherical.phi += (this.camSpherical.targetPhi - this.camSpherical.phi) * 0.09;
        this.camSpherical.radius += (this.camSpherical.targetRadius - this.camSpherical.radius) * 0.09;

        const r = this.camSpherical.radius;
        const phi = this.camSpherical.phi;
        const theta = this.camSpherical.theta;

        let camX = r * Math.sin(phi) * Math.sin(theta);
        let camY = r * Math.cos(phi);
        let camZ = r * Math.sin(phi) * Math.cos(theta);

        if (this.cameraShake > 0.002) {
          camX += (Math.random() - 0.5) * this.cameraShake;
          camY += (Math.random() - 0.5) * this.cameraShake;
          camZ += (Math.random() - 0.5) * this.cameraShake;
          this.cameraShake *= 0.86;
        } else {
          this.cameraShake = 0;
        }

        this.camera.position.set(camX, camY, camZ);
        this.camera.lookAt(this.camSpherical.lookAt);

        // 2. Animate Piece IDLE & SELECTED States (Hover Oscillation, Halo Rotation, Weapon Poise)
        Object.entries(this.pieceMeshes).forEach(([sq, mesh]) => {
          const { animState, bodyGroup, haloGroup, weaponGroup, phase } = mesh.userData;
          const isSelected = sq === this.selectedSquare;

          if (animState === 'IDLE') {
            const targetElevation = isSelected ? 0.34 + Math.sin(elapsed * 5) * 0.05 : Math.sin(elapsed * 2.2 + phase) * 0.03;
            bodyGroup.position.y += (targetElevation - bodyGroup.position.y) * 0.16;

            // Gentle rotation of floating crowns, orbs, and diadem shards
            haloGroup.rotation.y += isSelected ? 0.06 : 0.015;
            haloGroup.position.y = Math.sin(elapsed * 3.0 + phase) * 0.035;

            // Subtle breathing poise on weapons
            weaponGroup.position.y = Math.cos(elapsed * 2.4 + phase) * 0.02;
          }
        });

        // 3. Update SHATTERING Physics Shards (Velocity, Gravity, Board Bounce & Dissolve)
        for (let i = this.activeShards.length - 1; i >= 0; i--) {
          const s = this.activeShards[i];
          s.age += dt;

          if (s.age >= s.maxAge) {
            this.scene.remove(s.mesh);
            s.mesh.geometry.dispose();
            s.mesh.material.dispose();
            this.activeShards.splice(i, 1);
            continue;
          }

          // Gravity & translation
          s.vel.y -= 13.5 * dt;
          s.mesh.position.addScaledVector(s.vel, dt);

          // Floor bounce on the stone altar surface
          if (s.mesh.position.y < 0.05) {
            s.mesh.position.y = 0.05;
            s.vel.y = Math.abs(s.vel.y) * 0.42;
            s.vel.x *= 0.72;
            s.vel.z *= 0.72;
            s.angVel.multiplyScalar(0.75);
          }

          s.mesh.rotation.x += s.angVel.x * dt;
          s.mesh.rotation.y += s.angVel.y * dt;
          s.mesh.rotation.z += s.angVel.z * dt;

          // Smooth alpha & scale erosion in final 35% of life
          const lifeRatio = s.age / s.maxAge;
          if (lifeRatio > 0.65) {
            const fade = 1 - (lifeRatio - 0.65) / 0.35;
            s.mesh.material.opacity = Math.max(0, fade);
            s.mesh.scale.multiplyScalar(0.97);
          }
        }

        // 4. Update Combat Shockwaves, Arcane Beams & Dynamic Point Light Flash
        if (this.combatLight.intensity > 0.05) {
          this.combatLight.intensity *= 0.88;
        } else {
          this.combatLight.intensity = 0;
        }

        for (let i = this.combatEffects.length - 1; i >= 0; i--) {
          const fx = this.combatEffects[i];
          fx.age += dt;
          const progress = fx.age / fx.maxAge;

          if (progress >= 1) {
            this.scene.remove(fx.mesh);
            fx.mesh.geometry.dispose();
            fx.mesh.material.dispose();
            this.combatEffects.splice(i, 1);
            continue;
          }

          if (fx.type === 'ring') {
            const scale = 1 + progress * 4.2;
            fx.mesh.scale.set(scale, scale, 1);
            fx.mesh.material.opacity = 1 - progress;
          } else if (fx.type === 'beam') {
            fx.mesh.material.opacity = 1 - progress;
          }
        }

        // 5. Update Move Trail Particles
        for (let i = this.moveTrailParticles.length - 1; i >= 0; i--) {
          const pt = this.moveTrailParticles[i];
          pt.age += dt;
          const progress = pt.age / pt.maxAge;
          if (progress >= 1) {
            this.scene.remove(pt.mesh);
            pt.mesh.geometry.dispose();
            pt.mesh.material.dispose();
            this.moveTrailParticles.splice(i, 1);
          } else {
            pt.mesh.position.y += dt * 0.45;
            pt.mesh.material.opacity = (1 - progress) * 0.7;
            pt.mesh.scale.setScalar(1 - progress * 0.6);
          }
        }

        // 6. Cathedral Sconce Flicker & Atmospheric Dust Drift
        this.sconceFlames.forEach((f) => {
          const flicker = 0.88 + Math.sin(elapsed * 11 + f.phase) * 0.16;
          f.mesh.scale.set(0.8 * flicker, 1.6 * flicker, 0.8 * flicker);
        });

        if (this.dustPoints) {
          this.dustPoints.rotation.y = elapsed * 0.018;
        }

        this.renderer.render(this.scene, this.camera);
      }
    }

    // Boot Cathedral Gambit on window load
    let app;
    window.onload = function () {
      app = new CathedralGambitApp();
    };
  </script>
</body>
